<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; color: #333; }
        input {
            width: 100%;
            padding: 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 12px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4facfe;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover { background: #3d8fd8; }
        .weather-result { margin-top: 25px; }
        .temp { font-size: 48px; font-weight: bold; color: #333; }
        .desc { text-transform: capitalize; color: #666; margin-bottom: 15px; }
        .details { display: flex; justify-content: space-around; margin-top: 15px; font-size: 14px; color: #555; }
        .error { color: #e74c3c; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Weather App</h1>
        <form method="POST">
            <input type="text" name="city" placeholder="Enter city name" required>
            <button type="submit">Get Weather</button>
        </form>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        {% if weather %}
        <div class="weather-result">
            <img src="https://openweathermap.org/img/wn/{{ weather.icon }}@2x.png" alt="weather icon">
            <div class="temp">{{ weather.temp }}°C</div>
            <div class="desc">{{ weather.description }}</div>
            <h3>{{ weather.city }}, {{ weather.country }}</h3>
            <div class="details">
                <span>Feels like: {{ weather.feels_like }}°C</span>
            </div>
            <div class="details">
                <span>Humidity: {{ weather.humidity }}%</span>
                <span>Wind: {{ weather.wind_speed }} m/s</span>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
